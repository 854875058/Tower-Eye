[pytest]
# 测试发现路径
testpaths = tests

# 测试文件、类、函数命名模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 常用选项
addopts = 
    -v
    --tb=short
    --strict-markers
    -W ignore::DeprecationWarning:pkg_resources
    -W ignore::DeprecationWarning:distutils
    -W ignore::PendingDeprecationWarning
    -W default::DeprecationWarning:tower_eye
    -W default::DeprecationWarning:tests

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
